name: Temporäre Demo veröffentlichen
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-demo
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Demo prüfen
        run: |
          node --check portal.js
          node --test tests/portal.test.cjs
      - name: Nur Demo-Dateien bereitstellen
        run: |
          mkdir -p _site
          cp index.html styles.css brand.css portal.js _site/
          cp -R assets _site/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Demo veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4

