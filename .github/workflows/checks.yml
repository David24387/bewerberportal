name: Portal checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: node --check portal.js
      - name: Check form allowlist, application workflow and demo boundaries
        run: node --test tests/portal.test.cjs
